name: 自动部署

# 只在 main 分支收到 push 时触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 支持手动触发

jobs:
  deploy:
    name: 部署到服务器（新版 backend_L / front_L）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 服务器在阿里云，直连 github.com 拉取会超时（国内网络），
      # 所以改由 Actions runner（可访问 GitHub）把代码 rsync 推到服务器，
      # 服务器只负责构建镜像、起容器。
      - name: 同步代码到服务器（rsync）
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 排除服务器本地文件：.env 密钥、运行时图片、node_modules、构建产物等
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${SERVER_PORT}" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'backend_L/.env' \
            --exclude '.env.production' \
            --exclude 'backend_L/data' \
            --exclude 'front_L/node_modules' \
            --exclude 'front_L/dist' \
            ./ ${SERVER_USER}@${SERVER_HOST}:/root/myspace/Blog_generate_agent/

      - name: SSH 执行部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 1200s
          command_timeout: 25m
          script_stop: true
          script: |
            set -e
            cd /root/myspace/Blog_generate_agent
            echo "=== 0. 预热基础镜像 ==="
            for image in python:3.12-slim node:20-alpine nginx:alpine; do
              docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image" || exit 1
            done
            echo "=== 1. 构建新后端镜像 ==="
            docker compose build backendl
            echo "=== 2. 构建新前端镜像 ==="
            docker compose build frontendl
            echo "=== 3. 更新服务并验证就绪状态 ==="
            docker compose up -d --wait --wait-timeout 120
            for attempt in 1 2 3 4 5; do
              if curl -fsS --max-time 8 http://127.0.0.1:8090/api/v1/ready; then
                break
              fi
              [ "$attempt" -lt 5 ] || exit 1
              sleep 2
            done
            echo "=== 部署完成: $(date) ==="
