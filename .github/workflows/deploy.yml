name: 自动部署

# 只在 main 分支收到 push 时触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 支持手动触发

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    steps:
      - name: SSH 执行部署脚本
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          # 前后端镜像构建（npm install + vite build）耗时较长，给足超时
          timeout: 1200s
          # 任何一条命令失败立即停止，方便定位
          script_stop: true
          script: |
            set -e
            cd /root/myspace/Blog_generate_agent
            echo "=== 1. 清理运行时生成的图片（避免 git pull 覆盖冲突）==="
            git clean -fd -- backend/data/images || true
            echo "=== 2. 拉取最新代码 ==="
            git pull --ff-only origin main
            echo "=== 3. 重建后端镜像（安装新增 Python 依赖，如 bcrypt）==="
            docker compose build backend
            echo "=== 4. 重建前端生产镜像 ==="
            docker compose --profile prod build frontend-prod
            echo "=== 5. 启动/更新容器 ==="
            docker compose --profile prod up -d
            echo "=== 6. 等待后端启动 ==="
            sleep 8
            echo "=== 7. 数据库迁移（幂等：补齐已存在表的新增列）==="
            docker exec blog-agent-backend python -m scripts.migrate
            echo "=== 8. 创建新表（幂等）==="
            docker exec blog-agent-backend python -m scripts.init_db
            echo "=== 部署完成: $(date) ==="
