services:
  # ========== PostgreSQL 数据库 ==========
  postgres:
    image: postgres:16-alpine
    container_name: blog-agent-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # ports:
    #   - "${POSTGRES_PORT}:5432"            # 生产环境不对外暴露数据库端口
    expose:
      - "5432"                                # 只在 Docker 内部网络可访问
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ========== 后端服务 ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog-agent-backend
    # ports:
    #   - "8000:8000"                       # 生产环境不对外暴露后端端口
    expose:
      - "8000"                              # 只在 Docker 内部网络可访问（Nginx/前端代理访问）
    volumes:
      - ./backend:/app                    # 代码挂载，热更新
    env_file:
      - ./backend/.env                    # 读取环境变量
    environment:
      - PYTHONPATH=/app
      - db_url=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}  # 生产数据库
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ========== 前端服务（开发模式，vite 热更新）==========
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile.dev
    container_name: blog-agent-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app                      # 代码挂载，热更新
      - /app/node_modules                 # 匿名卷，防止 node_modules 被覆盖
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  # ========== 前端服务（生产模式，nginx 托管构建产物）==========
  # 本地开发默认不启动；服务器部署：docker compose --profile prod up -d --build
  # 端口默认 80（服务器标准），本地验证可用 FRONTEND_PORT=8080 覆盖
  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: blog-agent-frontend-prod
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

# ========== 持久化卷 ==========
volumes:
  postgres_data:
