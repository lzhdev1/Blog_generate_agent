services:
  # ========== 后端服务 ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog-agent-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app                    # 代码挂载，热更新
      - backend_data:/app/data            # 数据库文件持久化
    env_file:
      - ./backend/.env                    # 读取环境变量
    environment:
      - PYTHONPATH=/app
      - db_url=sqlite:////app/data/blog_agent.db  # 数据库路径放到持久化卷
    restart: unless-stopped

  # ========== 前端服务 ==========
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: blog-agent-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app                      # 代码挂载，热更新
      - /app/node_modules                 # 匿名卷，防止 node_modules 被覆盖
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

# ========== 持久化卷 ==========
volumes:
  backend_data:
