# ============================================================
# 生产编排：新版 backend_L + front_L
#
# 蓝绿切换说明：
#   - 旧版线上容器（blog-agent-backend / blog-agent-frontend-prod /
#     blog-agent-postgres）已下线删除，Nginx 反代 127.0.0.1:8090
#   - 回滚：见 git 历史里的旧版 compose
#
# 数据库：本机统一实例 shared-postgres（见 D:\AMySpace\AMe\_infra\shared-db），连接串在 backend_L/.env
#
# 常用命令：
#   docker compose up -d --build      # 构建并启动
#   docker compose down               # 停止
#   docker compose logs -f backendl   # 看后端日志
# ============================================================
name: blog-agent-l-prod

services:
  # ========== 新后端（backend_L）==========
  backendl:
    build:
      context: ./backend_L
      dockerfile: Dockerfile
    container_name: blog-agent-l-backend-prod
    expose:
      - "8001"
    env_file:
      - ${BLOG_PRODUCTION_ENV_FILE:-./backend_L/.env}
    environment:
      - PYTHONPATH=/app
      - APP_ENV=production
    # 生产去掉 --reload（Dockerfile 默认 CMD 带热更新）
    command: uvicorn src.blog_agent.main:app --host 0.0.0.0 --port 8001 --limit-concurrency 160 --timeout-keep-alive 5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/ready', timeout=4).close()"]
      interval: 20s
      timeout: 6s
      retries: 3
      start_period: 20s
    # 持久化配图目录（容器内 /app/data/images）
    volumes:
      - backend_images:/app/data/images
    networks:
      - default
      - shared-db
    restart: unless-stopped

  # ========== 新前端（front_L，nginx 托管构建产物）==========
  frontendl:
    build:
      context: ./front_L
      dockerfile: Dockerfile
    container_name: blog-agent-l-frontend-prod
    # 只绑本机回环，由系统 Nginx 反代
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - backendl
    restart: unless-stopped

# ========== 持久化卷 ==========
volumes:
  backend_images:

networks:
  shared-db:
    external: true
