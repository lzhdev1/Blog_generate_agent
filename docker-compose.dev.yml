# ============================================================
# 开发环境编排：新后端 backend_L + 新前端 front_L
# 用法：docker compose -f docker-compose.dev.yml up -d --build
# 访问：新前端 http://localhost:5175  新后端 http://localhost:8001
# 数据库：本机统一实例 shared-postgres（见 D:\AMySpace\AMe\_infra\shared-db），连接串在 backend_L/.env
# 注意：服务名/项目名必须全小写（Docker 镜像名不允许大写）
# ============================================================
name: blog-agent-l

services:
  # ========== 新后端（backend_L，uvicorn --reload 热更新）==========
  backendl:
    build:
      context: ./backend_L
      dockerfile: Dockerfile
    container_name: blog-agent-l-backend
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./backend_L:/app               # 代码挂载，热更新
    env_file:
      - ./backend_L/.env               # 读取环境变量（db_url 指向 shared-postgres）
    environment:
      - PYTHONPATH=/app
    networks:
      - default
      - shared-db
    restart: unless-stopped

  # ========== 新前端（front_L，vite dev 热更新，/api → backendl:8001）==========
  frontendl:
    build:
      context: ./front_L
      dockerfile: Dockerfile.dev
    container_name: blog-agent-l-frontend
    ports:
      # 宿主 5175（容器内仍 5174）：5174 已被 lzh_show 的 TTFarm 开发端口占用
      - "127.0.0.1:5175:5174"
    volumes:
      - ./front_L:/app                 # 代码挂载，热更新
      - /app/node_modules              # 匿名卷，防止宿主机覆盖容器内依赖
    environment:
      - BLOG_AGENT_API_TARGET=http://backendl:8001
    depends_on:
      - backendl
    restart: unless-stopped

networks:
  shared-db:
    external: true
